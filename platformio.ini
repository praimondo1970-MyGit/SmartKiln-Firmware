; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Configuración por defecto: usar ESP32-S3
[platformio]
default_envs = esp32-s3-devkitc-1

; NOTA: El entorno esp32dev está comentado porque el código del display
; requiere ESP32-S3 con RGB Panel. Si necesitas compilar para ESP32 regular,
; necesitarás adaptar el código del display.
;
;[env:esp32dev]
;platform = espressif32
;board = esp32dev
;framework = arduino
;monitor_speed = 115200
;board_build.partitions = huge_app.csv
;lib_deps = 
;	adafruit/Adafruit MAX31855 library@^1.4.1
;	bblanchon/ArduinoJson@^6.21.3
;	Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
;	h2zero/NimBLE-Arduino@^1.4.3
;	lvgl/lvgl@^8.3.11
;	moononournation/GFX Library for Arduino@^1.4.0
;
;build_flags = 
;	-std=gnu++17
;	-Wall
;	-O2
;	-DCONFIG_TASK_WDT_TIMEOUT_S=15
;upload_speed = 921600

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
lib_deps = 
	adafruit/Adafruit MAX31855 library@^1.4.1
	bblanchon/ArduinoJson@^6.21.3
	Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.17
	lvgl/lvgl@^8.3.11
	moononournation/GFX Library for Arduino@1.6.2
lib_ignore = 
	NimBLE-Arduino

build_flags = 
	-std=gnu++17
	-Wall
	-O2
	-DSMARTKILN_ENABLE_BLE=0
	-DLV_FONT_MONTSERRAT_14=1
	; -DLV_FONT_MONTSERRAT_48=1  ; Deshabilitada - no se usa
	-Isrc
	-Iinclude
upload_speed = 115200
upload_flags = 
	--connect-attempts
	10
	--baud
	115200

